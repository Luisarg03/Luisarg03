<svg xmlns="http://www.w3.org/2000/svg" class="panel" width="900" height="444" viewBox="0 0 900 444" role="img" aria-label="Five areas of work: the ML platform for Data Scientists, Infrastructure as Code, Internal Developer Platforms, CI/CD and pipeline automation, and data platform reliability."><style>text{font-family:ui-monospace,'SF Mono','JetBrains Mono','Cascadia Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace}</style><defs><clipPath id="wid-clip"><rect width="900" height="444" rx="8"/></clipPath><filter id="wid-glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><g clip-path="url(#wid-clip)"><rect width="900" height="444" fill="#131820"/><rect width="900" height="34" fill="#0a0e14"/><text x="18" y="22" font-size="11" fill="#d7dde5"><tspan fill="#2AD4C9">~/</tspan><tspan fill="#d7dde5">what-i-do</tspan></text><circle cx="846" cy="17" r="3.5" fill="#2f3b4e"/><circle cx="862" cy="17" r="3.5" fill="#2f3b4e"/><circle cx="878" cy="17" r="3.5" fill="#2f3b4e"/><text x="40" y="74" font-size="12.5" fill="#f0b429">▸</text><text x="56" y="74" font-size="12.5" fill="#d7dde5" font-weight="500">ML platform for Data Scientists</text><text x="860" y="74" font-size="10" fill="#7d8794" letter-spacing="1" text-anchor="end">01</text><text x="56" y="95" font-size="11.5" fill="#9aa3b0">Operate an ABT generator used by 15+ Data Scientists: a LangGraph pipeline with a YAML</text><text x="56" y="112" font-size="11.5" fill="#9aa3b0">model registry and fallbacks, emitting .sql materialized in Athena.</text><line x1="40" y1="128" x2="860" y2="128" stroke="#232d3d" stroke-width="1"/><text x="40" y="150" font-size="12.5" fill="#f0b429">▸</text><text x="56" y="150" font-size="12.5" fill="#d7dde5" font-weight="500">Infrastructure as Code</text><text x="860" y="150" font-size="10" fill="#7d8794" letter-spacing="1" text-anchor="end">02</text><text x="56" y="171" font-size="11.5" fill="#9aa3b0">The CDK → Terraform migration at Prisma Medios de Pago, plus modules that stay honest:</text><text x="56" y="188" font-size="11.5" fill="#9aa3b0">reviewable plans, reproducible deploys, no snowflake stacks.</text><line x1="40" y1="204" x2="860" y2="204" stroke="#232d3d" stroke-width="1"/><text x="40" y="226" font-size="12.5" fill="#f0b429">▸</text><text x="56" y="226" font-size="12.5" fill="#d7dde5" font-weight="500">Internal Developer Platforms</text><text x="860" y="226" font-size="10" fill="#7d8794" letter-spacing="1" text-anchor="end">03</text><text x="56" y="247" font-size="11.5" fill="#9aa3b0">Self-service tooling that removes toil — a FastAPI + React variable catalog, drift and</text><text x="56" y="264" font-size="11.5" fill="#9aa3b0">pipeline monitoring with quality checks, and paved roads that ship without a ticket.</text><line x1="40" y1="280" x2="860" y2="280" stroke="#232d3d" stroke-width="1"/><text x="40" y="302" font-size="12.5" fill="#f0b429">▸</text><text x="56" y="302" font-size="12.5" fill="#d7dde5" font-weight="500">CI/CD &amp; pipeline automation</text><text x="860" y="302" font-size="10" fill="#7d8794" letter-spacing="1" text-anchor="end">04</text><text x="56" y="323" font-size="11.5" fill="#9aa3b0">Reusable GitHub Actions, Bitbucket, CodePipeline and CodeBuild templates for Data Science</text><text x="56" y="340" font-size="11.5" fill="#9aa3b0">teams, so build, test and deploy never get reinvented per project.</text><line x1="40" y1="356" x2="860" y2="356" stroke="#232d3d" stroke-width="1"/><text x="40" y="378" font-size="12.5" fill="#f0b429">▸</text><text x="56" y="378" font-size="12.5" fill="#d7dde5" font-weight="500">Data platform &amp; reliability</text><text x="860" y="378" font-size="10" fill="#7d8794" letter-spacing="1" text-anchor="end">05</text><text x="56" y="399" font-size="11.5" fill="#9aa3b0">Event-driven ingestion into SDLF lakes, from on-premise IBM/Mainframe sources to the</text><text x="56" y="416" font-size="11.5" fill="#9aa3b0">Salesforce API, with quality checks and monitoring. Automate the repetitive, own reliability.</text></g><rect x="0.5" y="0.5" width="899" height="443" rx="8" fill="none" stroke="#232d3d"/></svg>
