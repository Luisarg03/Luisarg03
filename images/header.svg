<svg xmlns="http://www.w3.org/2000/svg" class="panel" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="Terminal window: whoami returns @Luisarg03, Cloud and Data Platform Engineer, Buenos Aires, remote-first, with a fact sheet beside it."><style>text{font-family:ui-monospace,'SF Mono','JetBrains Mono','Cascadia Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace}.hdr-cur{animation:hdr-blink 1.15s steps(1,end) infinite}
