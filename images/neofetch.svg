<svg width="900" height="196" viewBox="0 0 900 196" xmlns="http://www.w3.org/2000/svg">
  <!-- Terminal panel -->
  <rect width="900" height="196" rx="6" fill="#131820" stroke="#232d3d" stroke-width="1"/>

  <!-- Tab bar -->
  <rect width="900" height="32" rx="6" fill="#0a0e14"/>
  <rect y="26" width="900" height="6" fill="#0a0e14"/>

  <!-- Tab label -->
  <text x="16" y="21" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="11" fill="#7d8794">~/identity</text>

  <!-- Tab dots -->
  <circle cx="860" cy="16" r="4" fill="#232d3d"/>
  <circle cx="876" cy="16" r="4" fill="#232d3d"/>
  <circle cx="892" cy="16" r="4" fill="#232d3d"/>

  <!-- Prompt -->
  <text x="20" y="60" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="14" fill="#d7dde5">luis@arch ~</text>

  <!-- Key:value pairs -->
  <text x="20" y="90" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="13" fill="#d7dde5">├── OS:       Arch Linux (Hyprland)</text>
  <text x="20" y="114" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="13" fill="#d7dde5">├── Role:     Cloud Platform Engineer</text>
  <text x="20" y="138" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="13" fill="#d7dde5">├── Stack:    7+ years · AWS · Terraform · CI/CD</text>
  <text x="20" y="162" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="13" fill="#d7dde5">├── Focus:    IaC · Data platforms · AI workflows</text>
  <text x="20" y="186" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="13" fill="#d7dde5">└── Location: Buenos Aires, Argentina</text>
</svg>
