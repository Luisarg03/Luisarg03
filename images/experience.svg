<svg width="900" height="350" viewBox="0 0 900 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Terminal panel -->
  <rect width="900" height="350" rx="6" fill="#131820" stroke="#232d3d" stroke-width="1"/>

  <!-- Tab bar -->
  <rect width="900" height="32" rx="6" fill="#0a0e14"/>
  <rect y="26" width="900" height="6" fill="#0a0e14"/>

  <!-- Tab label -->
  <text x="16" y="21" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="11" fill="#7d8794">~/experience.log</text>

  <!-- Tab dots -->
  <circle cx="860" cy="16" r="4" fill="#232d3d"/>
  <circle cx="876" cy="16" r="4" fill="#232d3d"/>
  <circle cx="892" cy="16" r="4" fill="#232d3d"/>

  <!-- Prompt line -->
  <text x="20" y="56" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="12" fill="#d7dde5">luis@arch ~$ journalctl -u career --since 2019</text>

  <!-- ===== Role 1: Interbank (ACTIVE) ===== -->
  <text x="20" y="88" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="12" fill="#d7dde5">Cloud Platform Engineer · Interbank (Peru, remote) · 2023–Present</text>
  <rect x="700" y="76" width="52" height="16" rx="3" fill="#0a0e14" stroke="#3fb950" stroke-width="1"/>
  <text x="708" y="88" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="10" fill="#3fb950">ACTIVE</text>

  <text x="36" y="112" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="11" fill="#7d8794">CI/CD template frameworks in GitHub Actions + Bitbucket Pipelines. ECR images for</text>
  <text x="36" y="130" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="11" fill="#7d8794">SageMaker training pipelines. IDP features. MCP integrations for Data Science</text>
  <text x="36" y="148" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="11" fill="#7d8794">teams. Centralized process monitoring.</text>

  <!-- Separator -->
  <line x1="20" y1="164" x2="880" y2="164" stroke="#232d3d" stroke-width="1"/>

  <!-- ===== Role 2: Prisma ===== -->
  <text x="20" y="188" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="12" fill="#d7dde5">AWS Data Platform Engineer · Prisma Medios de Pago (Argentina) · 2022–2023</text>

  <text x="36" y="212" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="11" fill="#7d8794">Large-scale IaC modernization: CDK → Terraform. Data ingestion pipelines with SDLF,</text>
  <text x="36" y="230" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="11" fill="#7d8794">event-driven orchestration (SQS, SNS, EventBridge). Salesforce API integration into</text>
  <text x="36" y="248" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="11" fill="#7d8794">enterprise Data Lake on S3.</text>

  <!-- Separator -->
  <line x1="20" y1="264" x2="880" y2="264" stroke="#232d3d" stroke-width="1"/>

  <!-- ===== Role 3: Tiendanube ===== -->
  <text x="20" y="288" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="12" fill="#d7dde5">Data Platform Engineer · Tiendanube (Argentina) · 2021–2022</text>

  <text x="36" y="312" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="11" fill="#7d8794">ETL pipelines with AWS Glue and Databricks. Lakehouse architecture design.</text>
  <text x="36" y="330" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="11" fill="#7d8794">SQL-based data access across teams through Trino.</text>
</svg>
