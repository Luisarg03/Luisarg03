<svg xmlns="http://www.w3.org/2000/svg" class="panel" width="900" height="429" viewBox="0 0 900 429" role="img" aria-label="Career log: Cloud Engineer at Interbank (2023 to now), AWS Data Platform Engineer at Prisma Medios de Pago (2022 to 2023), and Data Engineer at Tiendanube (2021 to 2022)."><style>text{font-family:ui-monospace,'SF Mono','JetBrains Mono','Cascadia Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace}.exp-pill{letter-spacing:.06em}</style><defs><clipPath id="exp-clip"><rect width="900" height="429" rx="8"/></clipPath><filter id="exp-glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><g clip-path="url(#exp-clip)"><rect width="900" height="429" fill="#131820"/><rect width="900" height="34" fill="#0a0e14"/><text x="18" y="22" font-size="11" fill="#d7dde5"><tspan fill="#2AD4C9">~/</tspan><tspan fill="#d7dde5">career.log</tspan></text><circle cx="846" cy="17" r="3.5" fill="#2f3b4e"/><circle cx="862" cy="17" r="3.5" fill="#2f3b4e"/><circle cx="878" cy="17" r="3.5" fill="#2f3b4e"/><text x="40" y="72" font-size="12.5" fill="#d7dde5"><tspan fill="#2AD4C9">luis@cloud</tspan><tspan fill="#7d8794">:</tspan><tspan fill="#2AD4C9">~</tspan><tspan fill="#7d8794">$ </tspan><tspan fill="#d7dde5">journalctl -u career --since 2019</tspan></text><text x="40" y="110" font-size="13" fill="#d7dde5" font-weight="500">Cloud Engineer</text><text x="860" y="110" font-size="10.5" fill="#7d8794" letter-spacing="0.6" text-anchor="end">2023 — now</text><text x="40" y="130" font-size="11.5" fill="#2AD4C9">Interbank · Peru (remote)</text><rect x="222.5" y="120" width="49.4" height="15" rx="3" fill="#0a0e14" stroke="#3fb950" stroke-width="1"/><text x="229.5" y="131" font-size="9" fill="#3fb950" letter-spacing="0.6" class="exp-pill">ACTIVE</text><text x="56" y="152" font-size="11.5" fill="#9aa3b0">Operate the ABT generator for 15+ Data Scientists: LangGraph, YAML registry, SQL in Athena.</text><text x="56" y="169" font-size="11.5" fill="#9aa3b0">Variable catalog (FastAPI + React), drift and pipeline monitoring, CI/CD templates for DS.</text><line x1="40" y1="184" x2="860" y2="184" stroke="#232d3d" stroke-width="1"/><text x="40" y="210" font-size="13" fill="#d7dde5" font-weight="500">AWS Data Platform Engineer</text><text x="860" y="210" font-size="10.5" fill="#7d8794" letter-spacing="0.6" text-anchor="end">2022 — 2023</text><text x="40" y="230" font-size="11.5" fill="#2AD4C9">Prisma Medios de Pago · Argentina</text><text x="56" y="252" font-size="11.5" fill="#9aa3b0">Migrated legacy AWS CDK (SDLF) platform infrastructure to Terraform, with GitLab CI.</text><text x="56" y="269" font-size="11.5" fill="#9aa3b0">Event-driven ingestion into the SDLF lake — IBM/Mainframe on-premise sources + Salesforce API.</text><line x1="40" y1="284" x2="860" y2="284" stroke="#232d3d" stroke-width="1"/><text x="40" y="310" font-size="13" fill="#d7dde5" font-weight="500">Data Engineer</text><text x="860" y="310" font-size="10.5" fill="#7d8794" letter-spacing="0.6" text-anchor="end">2021 — 2022</text><text x="40" y="330" font-size="11.5" fill="#2AD4C9">Tiendanube · Argentina</text><text x="56" y="352" font-size="11.5" fill="#9aa3b0">Built end-to-end ingestion ETL in a 4-person team starting the company lakehouse.</text><text x="56" y="369" font-size="11.5" fill="#9aa3b0">Airflow orchestration, Glue and Databricks processing, S3 and Redshift storage, Trino queries.</text><text x="40" y="399" font-size="11" fill="#f0b429">▸</text><text x="56" y="399" font-size="11" fill="#7d8794">4 earlier roles · 2019 – 2021 · expanded below</text></g><rect x="0.5" y="0.5" width="899" height="428" rx="8" fill="none" stroke="#232d3d"/></svg>
